<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Una flor</title>
  <style>
    :root {
      --velocidad: 12s; /* Cambia esto: 6s = más rápido, 20s = más lento */
      --tamano-flor: min(58vw, 420px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: white;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .escena {
      width: var(--tamano-flor);
      height: var(--tamano-flor);
      display: grid;
      place-items: center;
      perspective: 900px;
    }

    .flor {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-style: preserve-3d;
      animation: girar var(--velocidad) linear infinite;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes girar {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flor { animation: none; }
    }
  </style>
</head>
<body>
  <main class="escena">
    <!--
      PARA CAMBIAR LA FLOR:
      reemplaza "flor.png" por otra imagen y conserva ese mismo nombre.
      Idealmente usa un PNG con fondo transparente.
    -->
    <img class="flor" src="flor.png" alt="Flor amarilla">
  </main>
</body>
</html>
